name: Docker image

# Builds the image on every push to main (tagged `main`) and on every release tag
# (tagged `1.2.3`, `1.2` and `latest`), for amd64 and arm64.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Taproot
            org.opencontainers.image.description=Self-hosted project canvas with an MCP server and REST API for agents
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name t -p 8787:8787 $(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          for i in $(seq 1 40); do curl -sf http://localhost:8787/healthz && break; sleep 1; done
          curl -sf http://localhost:8787/healthz | grep -q '"ok":true'
