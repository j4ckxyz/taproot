name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the built server
        run: |
          DATA_DIR=$RUNNER_TEMP/data PORT=8788 node dist/server/index.js &
          for i in $(seq 1 30); do curl -sf http://localhost:8788/healthz && break; sleep 1; done
          curl -sf http://localhost:8788/healthz | grep -q '"ok":true'
          curl -sf http://localhost:8788/api/openapi.json > /dev/null
          curl -sf http://localhost:8788/ | grep -q '<div id="root">'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
